<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="128" fill="#0f2444"/>
  <g transform="translate(256, 256)">
    <!-- Chevron Izquierdo -->
    <g transform="translate(-140, -10) scale(1.6, 1.1)">
      <path fill="#F94633" d="M-40,-45 L10,0 L-40,45 L-5,45 L30,0 L-5,-45 Z" />
    </g>
    <!-- Letra V -->
    <text text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-family="Arial Black, sans-serif" font-weight="900" font-size="220" y="-10">V</text>
    <!-- Chevron Derecho -->
    <g transform="translate(140, -10) scale(-1.6, 1.1)">
      <path fill="#F94633" d="M-40,-45 L10,0 L-40,45 L-5,45 L30,0 L-5,-45 Z" />
    </g>
    <!-- Barra inferior -->
    <rect x="-160" y="120" width="320" height="18" fill="#F94633" rx="9" />
  </g>
</svg>
